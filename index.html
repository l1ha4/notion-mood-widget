<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как ты сегодня?</title>
<link rel="stylesheet" href="diary.css">
<style>
  /* Notion задаёт высоту iframe сам: центрируем, чтобы лишнее место
     не копилось снизу, а делилось поровну. */
  body { display: flex; align-items: center; }

  .wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .status { opacity: 0; transition: opacity .15s ease; }
  .status.on { opacity: 1; }

  .row { display: flex; gap: 4px; }

  .opt {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 7px 2px 6px;
    font: inherit;
    font-size: 11px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }

  .opt:hover { background: var(--hover); color: var(--text); }

  .opt[aria-pressed="true"] {
    background: var(--sel-bg);
    border-color: var(--sel-line);
    color: var(--text);
  }

  .opt svg { width: 18px; height: 18px; display: block; flex: none; }

  .opt span {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  @media (max-width: 360px) {
    .opt span { display: none; }
    .opt { padding: 8px 2px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title" id="head">Как ты сегодня?</div>
      <div class="muted status" id="status"></div>
    </div>
    <div class="row" id="row" role="group" aria-label="Настроение дня"></div>
  </div>

<script src="diary.js"></script>
<script>
(function () {
  var SHAPES = {
    hard:  { mouth: 'M8.5 16c.9-1.5 2.1-2.2 3.5-2.2s2.6.7 3.5 2.2', brows: true },
    meh:   { mouth: 'M8.5 15.4c.9-.9 2.1-1.4 3.5-1.4s2.6.5 3.5 1.4' },
    calm:  { mouth: 'M8.5 14.8h7' },
    good:  { mouth: 'M8.5 13.8c.9.9 2.1 1.4 3.5 1.4s2.6-.5 3.5-1.4' },
    great: { mouth: 'M8 13.4c.9 1.6 2.3 2.4 4 2.4s3.1-.8 4-2.4' }
  };

  var face = '<circle cx="12" cy="12" r="9"/><path d="M9 10h.01"/><path d="M15 10h.01"/>';
  var row = document.getElementById('row');
  var status = document.getElementById('status');
  var head = document.getElementById('head');

  function icon(id) {
    var s = SHAPES[id];
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      face +
      (s.brows ? '<path d="M8.6 7.9 10.4 8.8"/><path d="M15.4 7.9 13.6 8.8"/>' : '') +
      '<path d="' + s.mouth + '"/></svg>';
  }

  Diary.MOODS.forEach(function (m) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.dataset.id = m.id;
    btn.setAttribute('aria-pressed', 'false');
    btn.title = m.label;
    btn.innerHTML = icon(m.id) + '<span>' + m.label + '</span>';
    btn.addEventListener('click', function () {
      var date = Diary.cursor();
      var cur = Diary.get(date).mood;
      Diary.set(date, { mood: cur === m.id ? null : m.id });
    });
    row.appendChild(btn);
  });

  function render() {
    var date = Diary.cursor();
    var isToday = date === Diary.today();
    var day = Diary.get(date);
    var m = Diary.mood(day.mood);

    head.textContent = isToday ? 'Как ты сегодня?' : 'Как прошёл этот день?';

    Array.prototype.forEach.call(row.children, function (btn) {
      btn.setAttribute('aria-pressed', btn.dataset.id === day.mood ? 'true' : 'false');
    });

    if (m) {
      status.textContent = (isToday ? 'Сегодня' : Diary.longDate(date)) + ' · ' + m.low;
      status.classList.add('on');
    } else {
      status.textContent = isToday ? '' : Diary.longDate(date);
      status.classList.toggle('on', !isToday);
    }
  }

  Diary.onChange(render);
  Diary.watchMidnight(render);
  render();
})();
</script>
</body>
</html>
